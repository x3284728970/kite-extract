name: kite-extract

concurrency:
  group: kite-extract
  cancel-in-progress: false

permissions:
  contents: write

on:
  schedule:
    # 每 8 小时一次（UTC 00:00 / 08:00 / 16:00，即北京时间 08:00 / 16:00 / 00:00）
    - cron: "0 */8 * * *"
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache playwright chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-${{ runner.os }}

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt playwright websocket-client
          python -m playwright install --with-deps chromium

      - name: Extract and encrypt
        env:
          KITE_ENC_KEY: ${{ secrets.KITE_ENC_KEY }}
        run: |
          python scripts/kite.py

      - name: Commit encrypted output
        run: |
          git config user.name "actions-bot"
          git config user.email "actions-bot@users.noreply.github.com"
          git add output/kite.txt.enc
          git commit -m "update data $(date -u +%Y%m%d-%H%M)" || echo "no change"
          git push
