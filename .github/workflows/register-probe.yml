name: kite-register-probe

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "send | register"
        required: true
        default: "send"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache playwright chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-${{ runner.os }}

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt playwright websocket-client
          python -m playwright install --with-deps chromium

      - name: Run stage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python scripts/register_stage.py "${{ inputs.stage }}"
          echo "rc=$?"
          exit 0
